services:
  # ---------------------------------------------------------------------------
  # Default standalone OpenHisaab (In-Memory)
  # ---------------------------------------------------------------------------
  openhisaab:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - DB_TYPE=memory

  # ---------------------------------------------------------------------------
  # Profile: PostgreSQL
  # Run with: docker compose --profile postgres up
  # ---------------------------------------------------------------------------
  app-postgres:
    build: .
    profiles: ["postgres"]
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DB_TYPE=postgres
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=openhisaab
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword

  postgres-db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=openhisaab
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openhisaab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Profile: CockroachDB
  # Run with: docker compose --profile cockroachdb up
  # ---------------------------------------------------------------------------
  app-cockroach:
    build: .
    profiles: ["cockroachdb"]
    ports:
      - "8080:8080"
    depends_on:
      cockroach-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DB_TYPE=cockroachdb
      - DB_HOST=cockroach-db
      - DB_PORT=26257
      - DB_NAME=openhisaab
      - DB_USER=root
      - DB_SSL=false

  cockroach-db:
    image: cockroachdb/cockroach:latest-v23.2
    profiles: ["cockroachdb"]
    command: start-single-node --insecure --http-addr=0.0.0.0:8085
    ports:
      - "26257:26257"
      - "8085:8085"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Profile: MySQL
  # Run with: docker compose --profile mysql up
  # ---------------------------------------------------------------------------
  app-mysql:
    build: .
    profiles: ["mysql"]
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DB_TYPE=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=openhisaab
      - DB_USER=root
      - DB_PASSWORD=mysqlpassword

  mysql-db:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      - MYSQL_DATABASE=openhisaab
      - MYSQL_ROOT_PASSWORD=mysqlpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysqlpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Profile: Microsoft SQL Server (MSSQL)
  # Run with: docker compose --profile mssql up
  # ---------------------------------------------------------------------------
  app-mssql:
    build: .
    profiles: ["mssql"]
    ports:
      - "8080:8080"
    depends_on:
      - mssql-db
    environment:
      - PORT=8080
      - DB_TYPE=mssql
      - DB_HOST=mssql-db
      - DB_PORT=1433
      - DB_NAME=openhisaab
      - DB_USER=sa
      - DB_PASSWORD=StrongPassword123!
      - DB_SSL=false

  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql"]
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # ---------------------------------------------------------------------------
  # Profile: MongoDB
  # Run with: docker compose --profile mongodb up
  # ---------------------------------------------------------------------------
  app-mongo:
    build: .
    profiles: ["mongodb"]
    ports:
      - "8080:8080"
    depends_on:
      mongo-db:
        condition: service_healthy
    environment:
      - PORT=8080
      - DB_TYPE=mongodb
      - DATABASE_URL=mongodb://mongo-db:27017/openhisaab

  mongo-db:
    image: mongo:7.0
    profiles: ["mongodb"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  cockroach_data:
  mysql_data:
  mssql_data:
  mongo_data:
