apiVersion: v1
kind: Secret
metadata:
  name: openhisaab-secret
  namespace: openhisaab
  labels:
    app.kubernetes.io/name: openhisaab
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "change-me-in-production"
  # Optional: Provide full connection string directly (overrides DB_HOST, DB_USER, etc.)
  # Examples:
  # PostgreSQL:  postgresql://user:pass@host:5432/openhisaab?sslmode=disable
  # CockroachDB: postgresql://root@cockroach-service:26257/openhisaab?sslmode=disable
  # MySQL:       mysql://user:pass@host:3306/openhisaab
  # MSSQL:       Server=host,1433;Database=openhisaab;User Id=sa;Password=pass;TrustServerCertificate=true;
  # MongoDB:     mongodb://user:pass@mongodb-service:27017/openhisaab?authSource=admin
  DATABASE_URL: ""
