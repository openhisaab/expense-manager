apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhisaab-ingress
  namespace: openhisaab
  labels:
    app.kubernetes.io/name: openhisaab
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - expenses.example.com
      secretName: openhisaab-tls
  rules:
    - host: expenses.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhisaab-service
                port:
                  number: 80
